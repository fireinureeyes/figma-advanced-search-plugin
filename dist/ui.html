<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <style>
/* Ported from the v1 inline <style> block. The only additions are the fixed row
   height the virtualised table depends on, the sticky header, and the two
   status-line classes that replace the old inline styles. */

body {
  font-family: 'Tahoma', sans-serif;
  font-size: 15px;
  height: 100vh;
  margin: 0;
  display: flex;
  flex-direction: column;
  overflow-y: hidden;
}

.header {
  display: flex;
  padding: 10px;
  justify-content: space-between;
  align-items: center;
  background-color: #d4d4d4;
  padding-bottom: 10px;
  margin-bottom: 10px;
}

.header-buttons {
  display: flex;
  gap: 10px;
}

.button {
  background-color: #007bff;
}

.button:hover {
  background-color: #0056b3;
}

.main-container {
  margin: 0px 10px 20px;
  display: flex;
  gap: 20px;
  flex: 1;
  overflow: hidden;
}

.left-panel {
  flex: 2.5;
  overflow-y: auto;
}

.selector {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 10px;
}

p {
  margin: 0px 0;
}

select,
input[type="text"],
input[type="number"],
button {
  padding: 5px;
  margin: 5px 0;
}

select,
input[type="text"],
input[type="number"] {
  width: 120px;
}

#objectScope {
  width: 150px;
}

button {
  background-color: #096e47;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  padding: 8px 8px;
}

button:hover {
  background-color: #075235;
}

button:disabled {
  background-color: #cccccc;
  cursor: not-allowed;
}

#filterContainer {
  margin-top: 0px;
}

#addFilter {
  background-color: #007bff;
  padding: 8px 15px;
}

#addFilter:hover {
  background-color: #0056b3;
}

.filterRow {
  display: flex;
  align-items: center;
  padding: 5px;
  margin-bottom: 5px;
  background-color: #e3ecff;
}

.filterRow label {
  margin-right: 5px;
}

.filterRow input[type="text"],
.filterRow input[type="number"] {
  margin-right: 5px;
}

.buttons {
  margin-left: auto;
  margin-right: 4px;
  display: flex;
}

.removeFilter,
.identify {
  margin-left: auto;
  margin-right: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  padding: 0;
}

.removeFilter {
  background-color: #dc3545;
}

.removeFilter:hover {
  background-color: #c82333;
}

.identify {
  background-color: #007bff;
}

.identify:hover {
  background-color: #0056b3;
}

.status {
  text-align: left;
  min-height: 1em;
  margin: 6px 0;
}

.status-loading {
  font-weight: bold;
  color: #c0392b;
  display: none;
}

.status-tip {
  color: #096e47;
  display: none;
}

#elementCount {
  margin-top: 10px;
  font-weight: bold;
}

.actions {
  display: flex;
  align-items: center;
  gap: 10px;
  bottom: 0;
  background-color: white;
  padding: 10px 0;
}

.results {
  flex: 2;
  overflow-y: auto;
  border: 1px solid #ccc;
  padding: 5px 2px;
  border-radius: 4px;
}

.results table {
  width: 100%;
  border-collapse: collapse;
  cursor: pointer;
  table-layout: fixed;
}

.results thead th {
  position: sticky;
  top: 0;
  background-color: white;
  z-index: 1;
}

.results th,
.results td {
  padding: 8px;
  text-align: left;
  border-bottom: 1px solid #ddd;
  /* Fixed height + no wrapping: the virtualised table computes scroll offsets
     from ROW_HEIGHT in results-table.ts. Keep the two in sync. */
  height: 34px;
  box-sizing: border-box;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.results th:first-child,
.results td:first-child {
  width: 34px;
}

.results th:nth-child(2),
.results td:nth-child(2) {
  width: 70px;
}

.results tbody tr:hover {
  background-color: #f0f0f0;
}

/* Spacer rows stand in for the thousands of rows that are not rendered. */
.results tr.spacer,
.results tr.spacer td {
  padding: 0;
  border: none;
  height: auto;
}

.results tr.spacer:hover {
  background-color: transparent;
}

th {
  color: black;
  cursor: default;
}

.select-checkbox,
#selectAllCheckbox {
  cursor: pointer;
  width: 12px;
  height: 12px;
  transform: scale(1.5);
}

</style>
</head>

<body>
  <div class="header">
    <div>
      Build conditions and find, rename, export, delete or duplicate anything from the canvas.
    </div>
    <div class="header-buttons">
      <button id="loadSelection" class="button">⌖ Load all from selection</button>
      <button id="refresh" class="button">Refresh</button>
      <button id="reset" class="button">Reset filters</button>
      <button id="csv" class="button">Export list as CSV</button>
    </div>
  </div>

  <div class="main-container">
    <div class="left-panel">
      <div class="selector">
        <p>
          Find all
          <select id="elementType">
            <option value="ANY">objects</option>
            <option value="UNION">unions</option>
            <option value="SUBTRACT">subtracts</option>
            <option value="INTERSECT">intersects</option>
            <option value="EXCLUDE">excludes</option>
            <option value="COMPONENT">components</option>
            <option value="ELLIPSE">ellipses</option>
            <option value="FRAME">frames</option>
            <option value="GROUP">groups</option>
            <option value="INSTANCE">instances</option>
            <option value="LINE">lines</option>
            <option value="POLYGON">polygons</option>
            <option value="RECTANGLE">rectangles</option>
            <option value="SECTION">sections</option>
            <option value="STAR">stars</option>
            <option value="TEXT">texts</option>
            <option value="VECTOR">vectors</option>
          </select>
        </p>
        <p>
          in the
          <select id="objectScope">
            <option value="current-page">current page</option>
            <option value="all-pages">whole document</option>
            <option value="current-selection">current selection</option>
          </select>
        </p>
      </div>

      <div id="filterContainer"></div>

      <button id="addFilter">+ Add filter condition</button>

      <div id="loadingMessage" class="status status-loading"></div>
      <div id="tipMessage" class="status status-tip"></div>

      <p id="elementCount">0 elements found</p>

      <div class="actions">
        <label><input type="radio" name="action" value="select" checked> Select</label>
        <label><input type="radio" name="action" value="delete"> Delete</label>
        <label><input type="radio" name="action" value="duplicate"> Duplicate</label>
        <label><input type="radio" name="action" value="rename"> Rename</label>
        <label><input type="radio" name="action" value="export"> Export</label>
      </div>

      <div id="exportOptions" style="display: none;">
        <label>
          Scale
          <select id="exportScale">
            <option value="default" selected>default</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </label>
        <label>
          Format
          <select id="exportFormat">
            <option value="default" selected>default</option>
            <option value="PNG">PNG</option>
            <option value="JPG">JPG</option>
          </select>
        </label>
        <label>
          Suffix
          <input type="text" id="exportSuffix" value="default" />
        </label>
      </div>

      <input type="text" id="replaceText" placeholder="Text to replace" style="display: none;">
      <input type="text" id="newName" placeholder="New name. Try {id}, {name}, {page}, {date} or {alphabet}"
        style="display: none; width: 350px;">
      <button id="execute">Execute</button>
    </div>

    <div id="resultsContainer" class="results">
      <table id="resultsTable">
        <thead>
          <tr id="resultsTableHeader">
            <th><input type="checkbox" id="selectAllCheckbox"></th>
            <th>ID</th>
            <th>Layer Name</th>
            <th>Page</th>
            <th id="newNameHeader" style="display: none;">New Name</th>
          </tr>
        </thead>
        <tbody id="resultsList"></tbody>
      </table>
    </div>
  </div>

  <script>
